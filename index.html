<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McNeal Mobile Notary Service - Premium Showcase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --silk: #FAF7F2;
            --deep-espresso: #2D1E17;
            --muted-bronze: #8C6A42;
            --navy-blue: #1A2E44; 
        }

        html {
            scroll-behavior: smooth;
        }

        /* Premium Slim Bronze Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--silk);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--muted-bronze);
            border-radius: 10px;
            border: 2px solid var(--silk);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7e5f3b;
        }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--deep-espresso);
            background-color: var(--silk);
            position: relative;
            overflow-x: hidden;
        }

        /* Luxury Grain/Noise Texture Overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0.04;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Premium Brown Shadow Cast */
        .shadow-premium-brown {
            box-shadow: 0 30px 60px rgba(45, 30, 23, 0.18), 
                        0 15px 30px rgba(45, 30, 23, 0.08);
        }

        /* Premium Reveal Animations */
        @keyframes revealUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .reveal-up {
            opacity: 0;
            animation: revealUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .delay-700 { animation-delay: 0.7s; }
        .delay-800 { animation-delay: 0.8s; }

        /* Premium Form Field Styles */
        input, select, textarea {
            transition: all 0.3s ease !important;
            border: 1px solid rgba(45, 30, 23, 0.1) !important;
            background-color: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(5px);
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--muted-bronze) !important;
            box-shadow: 0 0 15px rgba(140, 106, 66, 0.15);
            background-color: white !important;
            transform: translateY(-1px);
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            color: var(--deep-espresso);
        }
        
        .font-playfair-display { font-family: 'Playfair Display', serif; }
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }

        /* Glassmorphism & Convex Hybrid Buttons */
        .btn-convex {
            background: linear-gradient(135deg, rgba(184, 141, 94, 0.9) 0%, rgba(140, 106, 66, 0.8) 45%, rgba(89, 67, 42, 0.9) 100%); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow:  5px 5px 15px rgba(45, 30, 23, 0.2),
                         inset 1px 1px 2px rgba(255, 255, 255, 0.4),
                         inset -1px -1px 2px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.25);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .btn-convex:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow:  0 15px 30px rgba(184, 141, 94, 0.3),
                         inset 1px 1px 3px rgba(255, 255, 255, 0.5),
                         inset -1px -1px 3px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, rgba(204, 162, 117, 0.95) 0%, rgba(158, 121, 76, 0.9) 45%, rgba(110, 82, 52, 0.95) 100%);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .btn-convex:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.4);
        }

        .btn-convex-outline {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(140, 106, 66, 0.3);
            box-shadow: 0 8px 32px 0 rgba(45, 30, 23, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-convex-outline:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(140, 106, 66, 0.15);
            border-color: rgba(140, 106, 66, 0.5);
            box-shadow: 0 12px 40px 0 rgba(45, 30, 23, 0.1);
        }

        /* Earth Tone Floating Orbs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(40px, -60px) scale(1.1); }
            66% { transform: translate(-30px, 30px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 15s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Certificate Reflection & Premium Style */
        .cert-logo {
            filter: grayscale(0.2) contrast(1.1);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent, rgba(255, 255, 255, 0.1));
            position: relative;
            overflow: hidden;
        }
        .cert-logo:hover {
            filter: grayscale(0) contrast(1.2) brightness(1.05);
            transform: translateY(-5px) scale(1.05);
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .shimmer-overlay {
            position: absolute;
            top: 0;
            width: 150%;
            height: 100%;
            background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, 0.4) 50%, transparent 60%);
            animation: light-sweep 8s infinite ease-in-out;
            pointer-events: none;
            mix-blend-mode: overlay;
        }
        
        @keyframes light-sweep {
            0%, 70% { transform: translateX(-150%) skewX(-25deg); }
            85%, 100% { transform: translateX(150%) skewX(-25deg); }
        }

        /* Mobile specific fixes */
        @media (max-width: 640px) {
            .cert-container {
                flex-direction: row !important;
                gap: 1rem !important;
                justify-content: center !important;
                width: 100%;
                margin-bottom: 2rem !important;
            }
            .cert-logo {
                width: 4rem !important;
                height: 4rem !important;
                -webkit-box-reflect: none !important;
            }
            .name-heading {
                font-size: 3.5rem !important;
            }
        }

        /* Bio Section */
        .bio-photo-frame {
            position: relative;
            display: inline-block;
        }
        .bio-photo-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #b88d5e, #59432a);
            border: 2px solid rgba(255,255,255,0.2);
            translate: 10px 10px;
            border-radius: 1rem;
            z-index: 0;
            box-shadow: 0 30px 60px rgba(45, 30, 23, 0.18);
        }
        .bio-interest-card {
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(140, 106, 66, 0.15);
            transition: all 0.3s ease;
        }
        .bio-interest-card:hover {
            background: rgba(140, 106, 66, 0.08);
            border-color: rgba(140, 106, 66, 0.35);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(45, 30, 23, 0.1);
        }
    </style>
</head>
